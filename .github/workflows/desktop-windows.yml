name: Build Quad Browser Desktop (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main, master, feature/windows-desktop-browser]
    paths:
      - 'desktop-app/**'
      - '.github/workflows/desktop-windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: quad-browser-windows-installer
          path: desktop-app/release/*.exe
          if-no-files-found: error
          retention-days: 14
