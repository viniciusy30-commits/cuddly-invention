name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "_incoming/**"

  pull_request:

  # Roda sozinho quando o "Unpack incoming zip and commit" termina com sucesso
  workflow_run:
    workflows: ["Unpack incoming zip and commit"]
    types: [completed]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../MultiAccount.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quad-browser-debug
          path: MultiAccount.apk
          if-no-files-found: error
          retention-days: 14

      - name: Guardar commit buildado
        id: sha
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publicar versao (o app baixa daqui)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          target_commitish: ${{ steps.sha.outputs.value }}
          name: Multi Account v${{ github.run_number }}
          files: MultiAccount.apk
          make_latest: true
          
